<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10131a" />
    <link rel="icon" href="/src/assets/logo.svg" type="image/svg+xml" />
    <title>Codex Deck</title>
    <script>
      (function () {
        try {
          var value = JSON.parse(
            localStorage.getItem("codex-deck:appearance:v1") || "{}",
          );
          var theme =
            value.theme === "light" || value.theme === "dark"
              ? value.theme
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var motion =
            value.motion === "on" || value.motion === "off"
              ? value.motion
              : matchMedia("(prefers-reduced-motion: reduce)").matches
                ? "off"
                : "on";
          var effects = value.effects === "off" ? "off" : "on";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.motion = motion;
          document.documentElement.dataset.effects = effects;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === "light" ? "#f4f6f9" : "#10131a";
        } catch (error) {}
      })();
    </script>
    <style>
      :root {
        --boot-bg: #10131a;
        --boot-sidebar: #131720;
        --boot-surface: #1a1f2b;
        --boot-mid: #222836;
        --boot-text: #e9ecf2;
        --boot-dim: #97a1b0;
        --boot-line: #262c38;
      }
      html[data-theme="light"] {
        --boot-bg: #f4f6f9;
        --boot-sidebar: #fbfcfe;
        --boot-surface: #eef1f5;
        --boot-mid: #e4e8ef;
        --boot-text: #1d2433;
        --boot-dim: #5d6572;
        --boot-line: #e2e6ec;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family:
          "Geist", "Segoe UI Variable Text", "Segoe UI", "PingFang SC",
          "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .boot-shell {
        display: flex;
        height: 100dvh;
      }
      .boot-aside {
        width: 344px;
        min-width: 344px;
        border-right: 1px solid var(--boot-line);
        background: var(--boot-sidebar);
        padding: 18px 14px;
        box-sizing: border-box;
      }
      .boot-brand {
        font-weight: 600;
        font-size: 15px;
        margin: 6px 4px 16px;
      }
      .boot-search {
        height: 36px;
        border: 1px solid var(--boot-line);
        border-radius: 8px;
        background: var(--boot-surface);
        margin-bottom: 14px;
      }
      .boot-row {
        height: 32px;
        margin: 0 0 6px;
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          var(--boot-surface) 0%,
          var(--boot-mid) 45%,
          var(--boot-surface) 100%
        );
        background-size: 200% 100%;
        animation: boot-shimmer 1.2s ease-in-out infinite;
      }
      .boot-row:nth-child(2) {
        width: 92%;
      }
      .boot-row:nth-child(3) {
        width: 86%;
      }
      .boot-row:nth-child(5) {
        width: 80%;
      }
      .boot-name {
        height: 32px;
        margin: 0 0 6px;
        padding: 0 8px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        color: var(--boot-dim);
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        white-space: nowrap;
      }
      .boot-main {
        flex: 1;
        display: grid;
        place-items: center;
        color: var(--boot-dim);
        font-size: 14px;
      }
      @keyframes boot-shimmer {
        to {
          background-position: -100% 0;
        }
      }
      @media (max-width: 760px) {
        .boot-aside {
          width: 100%;
          min-width: 0;
        }
      }
      html[data-motion="off"] .boot-row {
        animation: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <aside class="boot-aside">
          <div class="boot-brand">Codex Deck</div>
          <div class="boot-search"></div>
          <div id="boot-projects">
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
          </div>
        </aside>
        <main class="boot-main" id="boot-status">正在读取项目…</main>
      </div>
    </div>
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem("codex-deck:snapshot:v2") ||
            localStorage.getItem("codex-deck:snapshot:v1") ||
            sessionStorage.getItem("codex-deck:snapshot:v2") ||
            sessionStorage.getItem("codex-deck:snapshot:v1");
          if (!raw) return;
          var data = JSON.parse(raw);
          var names = {};
          (data.projects || []).forEach(function (project) {
            var name =
              project.name ||
              String(project.cwd || "")
                .split(/[\\/]/)
                .pop();
            if (name) names[project.key || project.cwd || name] = name;
          });
          (data.threads || []).forEach(function (thread) {
            var key = thread.cwd || "";
            if (key && !names[key])
              names[key] = String(key).split(/[\\/]/).pop() || key;
          });
          var list = Object.keys(names).map(function (key) {
            return names[key];
          });
          if (!list.length) return;
          var root = document.getElementById("boot-projects");
          var status = document.getElementById("boot-status");
          if (root) {
            root.innerHTML = list
              .slice(0, 12)
              .map(function (name) {
                return (
                  '<div class="boot-name">📁 ' +
                  String(name)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;") +
                  "</div>"
                );
              })
              .join("");
          }
          if (status)
            status.textContent = "已载入 " + list.length + " 个项目，正在同步…";
        } catch (error) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
