<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Codex Deck</title>
    <style>
      html,body{margin:0;min-height:100%;background:#090c10;color:#e8edf5;font-family:"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
      .boot-shell{display:flex;height:100dvh}
      .boot-aside{width:344px;min-width:344px;border-right:1px solid #222b38;background:#0b1016;padding:18px 14px;box-sizing:border-box}
      .boot-brand{font-weight:700;font-size:15px;margin:6px 4px 16px}
      .boot-search{height:36px;border:1px solid #252f3d;border-radius:9px;background:#0c1219;margin-bottom:14px}
      .boot-row{height:32px;margin:0 0 6px;border-radius:8px;background:linear-gradient(90deg,#121922 0%,#1c2530 45%,#121922 100%);background-size:200% 100%;animation:boot-shimmer 1.2s ease-in-out infinite}
      .boot-row:nth-child(2){width:92%}
      .boot-row:nth-child(3){width:86%}
      .boot-row:nth-child(5){width:80%}
      .boot-name{height:32px;margin:0 0 6px;padding:0 8px;border-radius:8px;display:flex;align-items:center;color:#9aa6b6;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap}
      .boot-main{flex:1;display:grid;place-items:center;color:#97a3b2;font-size:14px}
      @keyframes boot-shimmer{to{background-position:-100% 0}}
      @media (max-width:760px){.boot-aside{width:100%;min-width:0}}
      @media (prefers-reduced-motion:reduce){.boot-row{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <aside class="boot-aside">
          <div class="boot-brand">Codex Deck</div>
          <div class="boot-search"></div>
          <div id="boot-projects">
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
            <div class="boot-row"></div>
          </div>
        </aside>
        <main class="boot-main" id="boot-status">正在读取项目…</main>
      </div>
    </div>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("codex-deck:snapshot:v2")
            || localStorage.getItem("codex-deck:snapshot:v1")
            || sessionStorage.getItem("codex-deck:snapshot:v2")
            || sessionStorage.getItem("codex-deck:snapshot:v1");
          if (!raw) return;
          var data = JSON.parse(raw);
          var names = {};
          (data.projects || []).forEach(function (project) {
            var name = project.name || String(project.cwd || "").split(/[\\/]/).pop();
            if (name) names[project.key || project.cwd || name] = name;
          });
          (data.threads || []).forEach(function (thread) {
            var key = thread.cwd || "";
            if (key && !names[key]) names[key] = String(key).split(/[\\/]/).pop() || key;
          });
          var list = Object.keys(names).map(function (key) { return names[key]; });
          if (!list.length) return;
          var root = document.getElementById("boot-projects");
          var status = document.getElementById("boot-status");
          if (root) {
            root.innerHTML = list.slice(0, 12).map(function (name) {
              return '<div class="boot-name">📁 ' + String(name)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;") + "</div>";
            }).join("");
          }
          if (status) status.textContent = "已载入 " + list.length + " 个项目，正在同步…";
        } catch (error) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
